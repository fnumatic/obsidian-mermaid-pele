name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: 'pnpm'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          pnpm build
          mkdir pele-mermaid
          cp dist/main.js dist/manifest.json dist/styles.css pele-mermaid/
          zip -r pele-mermaid.zip pele-mermaid
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pele-mermaid.zip
            dist/main.js
            dist/styles.css
            dist/manifest.json
